# site properties and page defaults
title: 代谢与衰老实验室
subtitle: 中山大学药学院 · Wang QP Lab
description: 王巧平教授课题组（Laboratory of Metabolism and Aging），主要从事肥胖、味觉、衰老及睡眠等领域的研究，聚焦能量代谢调控与抗衰老药物研发。
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: wangqp7@mail.sysu.edu.cn

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: styles

# force jekyll to include certain files/folders
include:
  - styles
  - scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
