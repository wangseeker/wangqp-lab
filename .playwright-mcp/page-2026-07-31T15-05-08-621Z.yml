              - heading "衰老研究" [level=1] [ref=e79]
              - generic [ref=e81]:
                - paragraph [ref=e82]:
                  - strong [ref=e85]: 1. 研发果蝇的抗衰老实验室系统
                - paragraph [ref=e86]:
                  - text: 果蝇因其生命周期短、与人类同源性高、易于操作等原因成为寿命研究的经典模式生物。通过对果蝇的研究，揭示衰老的生理和分子机制，为延长寿命提供了理论基础和干预措施。但是，寿命实验相对于其他研究领域的实验，周期长且繁琐，无法同时进行大规模的寿命实验，这在很大程度上限制了衰老研究的进展。为了提升果蝇寿命实验的效率，我们利用3D打印以及计算机算法创新性地开发了果蝇寿命实验系统，由果蝇寿命实验食物批量更换装置、成像装置以及计算机分析软件三部分组成。
                  - strong [ref=e87]: 该原型系统测试表明，与传统的方法相比，该系统可以提高
                  - strong [ref=e88]: "17"
                  - strong [ref=e89]: 倍实验效率
                  - text: 。此外，该设备利用计算机识别果蝇，避免了繁琐的存活果蝇的计数工作，将研究人员从繁琐的实验中脱离出来。
                  - strong [ref=e90]: 总的来说，果蝇寿命实验设备能够极大提升果蝇寿命实验的效率，同时减少研究者的工作量，弥补了该领域设备的空白
                  - text: 。
                - paragraph [ref=e91]
                - paragraph [ref=e92]
                - paragraph [ref=e93]:
                  - strong [ref=e94]:
                    - generic [ref=e95]: 2. 开发基于NAD通路的抗衰老药物
                - paragraph [ref=e97]: 提高机体NAD的含量可以延缓衰老，而机体NAD的含量的维持主要依赖于NAD挽救途径通路，占NAD含量的90%。我们前期通过虚拟筛选40万个天然来源的分子库，发现和验证了一个全新的可以提高NAD量的小分子激动剂，目前正在进行分子改造工作。
